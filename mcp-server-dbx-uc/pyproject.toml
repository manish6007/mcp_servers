[project]
name = "email-dq-mcp"
version = "0.1.0"
description = "MCP server that lets Claude investigate data quality and data accuracy issues in an Email Analytics platform on Databricks Unity Catalog."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MCP Server Team" }]
keywords = ["mcp", "databricks", "data-quality", "unity-catalog", "claude"]

dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-requests>=2.31.0",
]

[project.scripts]
email-dq-mcp = "email_dq_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_dq_mcp"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
